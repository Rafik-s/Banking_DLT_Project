name: Markdown Lint

on:
  push:
    branches: [main, develop]
    paths:
      - '**.md'
      - '.github/workflows/markdown-lint.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '**.md'

permissions:
  contents: read

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            CHANGELOG.md
            SECURITY.md
            SUPPORT_README.md
            docs/*.md
            contracts/*.md