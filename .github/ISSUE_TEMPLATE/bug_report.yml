name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug", "triage"]
assignees: ["Rafik-s"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much detail as possible.

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did you see this issue?
      options:
        - Dev
        - QA
        - Prod
        - Local
        - CI/CD
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - Bronze
        - Silver
        - Gold
        - Contracts
        - Reconciliation
        - DQ observability
        - Terraform
        - CI/CD
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: dataset
    attributes:
      label: Dataset (if applicable)
      placeholder: "e.g., transactions, customers"

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / error messages
      render: shell
      placeholder: |
        Paste DLT event log excerpts, error stack traces, or SQL output here.

  - type: input
    id: version
    attributes:
      label: Repo version / commit SHA
      placeholder: "e.g., v1.0.0 or abc123def"