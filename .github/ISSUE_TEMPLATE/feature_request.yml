name: ✨ Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement", "triage"]
assignees: ["Rafik-s"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem you're solving
        and your proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve?
      placeholder: "As a <role>, I want <capability>, so that <benefit>."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?

  - type: dropdown
    id: impact
    attributes:
      label: Expected impact
      options:
        - Low — nice to have
        - Medium — improves workflow
        - High — unblocks a critical use case
        - Critical — regulatory or security
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, references, or examples